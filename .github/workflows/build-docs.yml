name: Build Documents (PDF & DOCX)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-dejavu fonts-liberation
          python3 -m pip install markdown

      - name: Build PDF and DOCX
        run: |
          python3 convert.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medical-documents-pdf-docx
          path: dist/*

      - name: Commit and push generated files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-build: update PDF and DOCX documents [skip ci]"
            git push
          fi
